name: Supabase database foundation

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".env.example"
      - ".gitignore"
      - "src/database-service.js"
      - "src/supabase-client.js"
      - "app/**"
      - "control/**"
      - "app.js"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "pwa-controller.js"
      - "offline.html"
      - "tests/**"
      - "scripts/validate_database_foundation.py"
      - "scripts/scan_secrets.sh"
      - "scripts/bootstrap-development-admin.sql"
      - "scripts/bootstrap-skillward-super-admin.sql"
      - "scripts/phase9-*.sql"
      - "scripts/verify-migration-compatibility.sh"
      - "docs/migration-compatibility.md"
      - "docs/releases/phase-9-launch-hardening.md"
      - "docs/rollback/phase-9-launch-hardening.md"
      - "docs/commercial-pilot-readiness.md"
      - "docs/advanced-owner-control-plane.md"
      - "docs/runbooks/owner-control-recovery.md"
      - "docs/development-admin-bootstrap.md"
      - ".github/workflows/supabase-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Migrations, RLS, seed, pgTAP, and application tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Install the officially supported Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Validate migration and repository structure
        run: python3 scripts/validate_database_foundation.py

      - name: Scan tracked files for committed secrets
        run: bash scripts/scan_secrets.sh

      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Start local Supabase services
        shell: bash
        run: |
          set -euo pipefail
          startup_log="$RUNNER_TEMP/skillward-supabase-start.log"
          umask 077
          trap 'rm -f "$startup_log"' EXIT
          if supabase start > "$startup_log" 2>&1; then
            echo 'Local Supabase stack started without logging generated keys.'
            exit 0
          fi
          sed -E \
            -e 's/(│ (Publishable|Secret) Key │ )[^│]+/\1[REDACTED_LOCAL_KEY] /g' \
            -e 's/eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}/[REDACTED_JWT]/g' \
            -e 's/(sb_(secret|publishable))_[A-Za-z0-9_-]+/[REDACTED_KEY]/g' \
            -e 's/[A-Fa-f0-9]{64}/[REDACTED_LOCAL_KEY]/g' \
            "$startup_log" >&2
          exit 1

      - name: Prove the production-shaped legacy upgrade preserves records
        run: bash scripts/verify-migration-compatibility.sh

      - name: Apply clean migrations and test-only development seed
        run: supabase db reset

      - name: Reject database lint errors
        run: supabase db lint --local --schema public,private --level error --fail-on error

      - name: Run all database assertions
        run: supabase test db

      - name: Run existing JavaScript tests
        run: npm test

      - name: Build the browser application
        run: npm run build

      - name: Show local service status on failure
        if: failure()
        run: docker ps --format 'table {{.Names}}\t{{.Status}}'

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
