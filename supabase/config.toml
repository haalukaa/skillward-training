project_id = "skillward-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:4173/app/"
additional_redirect_urls = ["http://127.0.0.1:4173/**", "http://localhost:4173/**"]
enable_signup = false

[functions.request-demo]
verify_jwt = false

[functions.owner-control-api]
verify_jwt = true
